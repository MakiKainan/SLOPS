<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>SLOPS · Send a photo</title>
  <style>
    :root { --sage: #98cd89; --ink: #173210; --ink-soft: #496742; --paper: #fff; --tint: #ecf7e9; --tomato-bg: #ffe4dd; --tomato-ink: #9a2a14; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100dvh; background: var(--sage); color: var(--ink); font-family: ui-rounded, system-ui, -apple-system, "Segoe UI", sans-serif; display: flex; justify-content: center; padding: 24px 16px; }
    main { width: 100%; max-width: 440px; background: var(--paper); border-radius: 28px; padding: 24px; display: flex; flex-direction: column; gap: 16px; align-self: flex-start; }
    h1 { margin: 0; font-size: 28px; letter-spacing: .02em; }
    p { margin: 0; font-size: 17px; line-height: 1.4; color: var(--ink-soft); }
    .btn { display: flex; align-items: center; justify-content: center; width: 100%; min-height: 60px; border: 0; border-radius: 999px; font: inherit; font-size: 19px; font-weight: 600; cursor: pointer; }
    .primary { background: var(--ink); color: var(--paper); }
    .secondary { background: var(--tint); color: var(--ink); }
    .btn:disabled { opacity: .5; cursor: default; }
    img { width: 100%; max-height: 50dvh; object-fit: contain; border-radius: 20px; background: var(--tint); }
    .error { background: var(--tomato-bg); color: var(--tomato-ink); border-radius: 16px; padding: 12px 16px; font-weight: 600; }
    .done { font-size: 64px; text-align: center; margin: 8px 0 0; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <main>
    <h1>SLOPS</h1>
    <section id="pick">
      <p>Choose a photo and we'll send it straight to the sticker booth.</p>
    </section>
    <img id="preview" alt="Your photo" hidden />
    <p id="error" class="error" role="alert" hidden></p>
    <label class="btn secondary" id="chooseLabel" for="file">Choose photo</label>
    <input id="file" type="file" accept="image/*" hidden />
    <button class="btn primary" id="send" type="button" hidden>Send to booth</button>
    <section id="done" hidden>
      <p class="done" aria-hidden="true">🎉</p>
      <h1>Sent!</h1>
      <p>Look at the booth screen. Your photo is there now.</p>
    </section>
  </main>
  <script>
    const MAX_SIDE = 2048;
    const token = location.pathname.split("/").filter(Boolean).pop();
    const $ = (id) => document.getElementById(id);
    let blob = null;

    const showError = (msg) => { $("error").textContent = msg; $("error").hidden = !msg; };

    // Shrink on the phone so uploads are quick on mobile data. Browsers also decode HEIC here.
    async function shrink(file) {
      try {
        const bitmap = await createImageBitmap(file, { imageOrientation: "from-image" });
        const scale = Math.min(1, MAX_SIDE / Math.max(bitmap.width, bitmap.height));
        const canvas = document.createElement("canvas");
        canvas.width = Math.round(bitmap.width * scale);
        canvas.height = Math.round(bitmap.height * scale);
        const ctx = canvas.getContext("2d");
        ctx.fillStyle = "#fff";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.drawImage(bitmap, 0, 0, canvas.width, canvas.height);
        return await new Promise((resolve) => canvas.toBlob((b) => resolve(b || file), "image/jpeg", 0.9));
      } catch {
        return file; // let the booth try to read the original
      }
    }

    $("file").addEventListener("change", async () => {
      const file = $("file").files[0];
      if (!file) return;
      showError("");
      blob = await shrink(file);
      $("preview").src = URL.createObjectURL(blob);
      $("preview").hidden = false;
      $("send").hidden = false;
      $("chooseLabel").textContent = "Choose another";
    });

    $("send").addEventListener("click", async () => {
      if (!blob) return;
      $("send").disabled = true;
      $("send").textContent = "Sending…";
      showError("");
      const body = new FormData();
      body.append("photo", blob, "photo.jpg");
      try {
        const res = await fetch(location.pathname, { method: "POST", body });
        if (res.ok) {
          for (const id of ["pick", "preview", "send", "chooseLabel"]) $(id).hidden = true;
          $("done").hidden = false;
          return;
        }
        const json = await res.json().catch(() => ({}));
        if (json.code === "session_expired") showError("This QR code has expired. Ask the booth for a new one.");
        else if (json.code === "bad_image") showError("We couldn't read that file. Try a different photo.");
        else if (res.status === 413) showError("That photo is too big. Try a different one.");
        else showError("Something went wrong. Try again.");
      } catch {
        showError("No connection. Check your internet and try again.");
      }
      $("send").disabled = false;
      $("send").textContent = "Send to booth";
    });

    if (!token) showError("This link is incomplete. Scan the QR code at the booth again.");
  </script>
</body>
</html>
